.field{display:flex; flex-direction:column; gap:4px;}

.field select:focus, .field input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}

.numeric-grid .field .range{display:flex; gap:6px; align-items:center;}
.numeric-grid .field input{width:100%;}

.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:4px;}
.toolbar .spacer{flex:1;}
button.reset{

}
button.reset:hover{background:var(--row-hover);}

.summary{

}
.summary b{color:var(--text); font-size:1.05rem; display:block;}

.table-scroll{

}
table{border-collapse:collapse; width:100%; font-size:.85rem; min-width:1400px;}
thead th{

}
thead th.num{text-align:right;}
thead th .arrow{opacity:.35; margin-left:4px; font-size:.75em;}
thead th.sorted .arrow{opacity:1; color:var(--accent);}
tbody td{padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
tbody td.num{text-align:right; font-variant-numeric:tabular-nums;}
tbody tr:hover{background:var(--row-hover);}
tfoot td{

}
tfoot td.num{text-align:right;}
.badge{

footer{text-align:center; color:var(--muted); font-size:.78rem; padding:20px 0 30px;}

const COLS = DATA.cols;
const ROWS = DATA.rows;

const LABELS = {
  id_dp: "ID",
  departamento: "Departamento",
  seccional: "Seccional",
  nome_unidade: "Unidade",
  municipio: "Município",

  celulares_subtraidos: "Celulares Subtraídos"
};

const TEXT_COLS = ["id_dp","departamento","seccional","nome_unidade","municipio","tipo_unidade"];
const NUM_COLS = COLS.filter(c => !TEXT_COLS.includes(c));

const idx = {};
COLS.forEach((c,i) => idx[c] = i);

function uniqueSorted(colName){
  const i = idx[colName];
  const set = new Set();
  ROWS.forEach(r => set.add(r[i]));
  return Array.from(set).sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

function fillSelect(selectEl, values){
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    selectEl.appendChild(opt);
  });
}

fillSelect(document.getElementById('f-departamento'), uniqueSorted('departamento'));
fillSelect(document.getElementById('f-seccional'), uniqueSorted('seccional'));
fillSelect(document.getElementById('f-municipio'), uniqueSorted('municipio'));
fillSelect(document.getElementById('f-tipo'), uniqueSorted('tipo_unidade'));

const numericFiltersEl = document.getElementById('numericFilters');
NUM_COLS.forEach(c => {
  const field = document.createElement('div');
  field.className = 'field';
  field.innerHTML = `<label for="min-${c}">${LABELS[c] || c} &ge;</label>
    <input type="number" id="min-${c}" min="0" placeholder="0">`;
  numericFiltersEl.appendChild(field);
});

const headRow = document.getElementById('headRow');
COLS.forEach(c => {
  const th = document.createElement('th');
  th.dataset.col = c;
  const isNum = NUM_COLS.includes(c);
  if (isNum) th.classList.add('num');
  th.innerHTML = `${LABELS[c] || c}<span class="arrow">▲</span>`;
  th.addEventListener('click', () => setSort(c));
  headRow.appendChild(th);
});

let sortCol = null;
let sortDir = 1;

function setSort(col){
  if (sortCol === col){
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = NUM_COLS.includes(col) ? -1 : 1;
  }
  render();
}

function getFilters(){
  const f = {
    departamento: document.getElementById('f-departamento').value,
    seccional: document.getElementById('f-seccional').value,
    municipio: document.getElementById('f-municipio').value,
    tipo_unidade: document.getElementById('f-tipo').value,
    nome: document.getElementById('f-nome').value.trim().toLowerCase()
  };
  const mins = {};
  NUM_COLS.forEach(c => {
    const el = document.getElementById('min-' + c);
    const v = el.value;
    if (v !== '') mins[c] = Number(v);
  });
  f.mins = mins;
  return f;
}

function applyFilters(){
  const f = getFilters();
  return ROWS.filter(r => {
    if (f.departamento && r[idx.departamento] !== f.departamento) return false;
    if (f.seccional && r[idx.seccional] !== f.seccional) return false;
    if (f.municipio && r[idx.municipio] !== f.municipio) return false;
    if (f.tipo_unidade && r[idx.tipo_unidade] !== f.tipo_unidade) return false;
    if (f.nome && !r[idx.nome_unidade].toLowerCase().includes(f.nome)) return false;
    for (const c in f.mins){
      if (r[idx[c]] < f.mins[c]) return false;
    }
    return true;
  });
}

function fmt(v){
  if (typeof v === 'number') return v.toLocaleString('pt-BR');
  return v == null ? '' : v;
}

function render(){
  let filtered = applyFilters();

  if (sortCol){
    const i = idx[sortCol];
    const isNum = NUM_COLS.includes(sortCol);
    filtered = filtered.slice().sort((a,b) => {
      let av = a[i], bv = b[i];
      if (isNum) return (av - bv) * sortDir;
      return String(av).localeCompare(String(bv), 'pt-BR') * sortDir;
    });
  }

  Array.from(headRow.children).forEach(th => {
    th.classList.toggle('sorted', th.dataset.col === sortCol);
    const arrow = th.querySelector('.arrow');
    if (th.dataset.col === sortCol) arrow.textContent = sortDir === 1 ? '▲' : '▼';
    else arrow.textContent = '▲';
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  if (filtered.length === 0){
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = COLS.length;
    td.className = 'empty-msg';
    td.textContent = 'Nenhum registro encontrado para os filtros selecionados.';
    tr.appendChild(td);
    tbody.appendChild(tr);
  } else {
    const frag = document.createDocumentFragment();
    filtered.forEach(r => {
      const tr = document.createElement('tr');
      COLS.forEach(c => {
        const td = document.createElement('td');
        if (NUM_COLS.includes(c)) td.className = 'num';
        td.textContent = fmt(r[idx[c]]);
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
  }

  const footRow = document.getElementById('footRow');
  footRow.innerHTML = '';
  const totalTd = document.createElement('td');
  totalTd.textContent = 'Totais';
  footRow.appendChild(totalTd);
  for (let i = 1; i < COLS.length; i++){
    const c = COLS[i];
    const td = document.createElement('td');
    if (NUM_COLS.includes(c)){
      td.className = 'num';
      const sum = filtered.reduce((acc, r) => acc + (r[idx[c]] || 0), 0);
      td.textContent = fmt(sum);
    }
    footRow.appendChild(td);
  }

  const deps = new Set(filtered.map(r => r[idx.departamento]));
  const munis = new Set(filtered.map(r => r[idx.municipio]));
  document.getElementById('summary').innerHTML = `
    <div><b>${filtered.length.toLocaleString('pt-BR')}</b> unidades <span class="badge">de ${ROWS.length.toLocaleString('pt-BR')} total</span></div>
    <div><b>${deps.size}</b> departamento(s)</div>
    <div><b>${munis.size}</b> município(s)</div>
  `;
}

['f-departamento','f-seccional','f-municipio','f-tipo'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});
document.getElementById('f-nome').addEventListener('input', render);
NUM_COLS.forEach(c => {
  document.getElementById('min-' + c).addEventListener('input', render);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('f-departamento').value = '';
  document.getElementById('f-seccional').value = '';
  document.getElementById('f-municipio').value = '';
  document.getElementById('f-tipo').value = '';
  document.getElementById('f-nome').value = '';
  NUM_COLS.forEach(c => document.getElementById('min-' + c).value = '');
  sortCol = null; sortDir = 1;
  render();
});

render();
</script>
</body>
</html>
