<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuscaPreco - Comparador de Precos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      padding: 2rem 1rem;
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }

    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .search-container {
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
    }

    .search-box input {
      flex: 1;
      padding: 0.85rem 1.2rem;
      border: 2px solid #334155;
      border-radius: 12px;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: #38bdf8; }
    .search-box input::placeholder { color: #64748b; }

    .search-box button {
      padding: 0.85rem 1.8rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .search-box button:hover { background: #7dd3fc; }

    .search-box button:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* Stats */
    .stats {
      max-width: 900px;
      margin: 0 auto 1.5rem;
      padding: 0 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 0.8rem 1.3rem;
      text-align: center;
      min-width: 140px;
    }

    .stat-card .label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-card .value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 0.15rem;
    }

    .stat-card.menor .value { color: #4ade80; }
    .stat-card.maior .value { color: #f87171; }

    /* Avisos */
    .avisos {
      max-width: 900px;
      margin: 0 auto 1rem;
      padding: 0 1rem;
    }

    .aviso {
      background: #422006;
      border: 1px solid #92400e;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: #fbbf24;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 3rem 1rem;
      display: none;
    }

    .loading.active { display: block; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    .loading p { color: #94a3b8; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .results {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    .result-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.6rem;
      transition: border-color 0.2s;
    }

    .result-card:hover { border-color: #475569; }

    .result-card.melhor {
      border-color: #4ade80;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.08);
    }

    .result-link {
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .result-rank {
      font-size: 1rem;
      font-weight: 700;
      color: #64748b;
      min-width: 28px;
      text-align: center;
    }

    .result-card.melhor .result-rank { color: #4ade80; }

    .result-img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: contain;
      background: #fff;
      flex-shrink: 0;
    }

    .result-img-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      background: #334155;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 1.5rem;
    }

    .result-info {
      flex: 1;
      min-width: 0;
    }

    .result-nome {
      font-size: 0.9rem;
      font-weight: 500;
      color: #f1f5f9;
      margin-bottom: 0.3rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-meta {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .badge {
      padding: 0.12rem 0.5rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .badge-google { background: #1d4ed8; color: #bfdbfe; }
    .badge-amazon { background: #b45309; color: #fef3c7; }

    .result-preco {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
      text-align: right;
      min-width: 110px;
    }

    .result-card.melhor .result-preco { color: #4ade80; }

    .tag-melhor {
      background: #166534;
      color: #4ade80;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Sort bar */
    .sort-bar {
      max-width: 900px;
      margin: 0 auto 0.75rem;
      padding: 0 1rem;
      display: none;
      justify-content: flex-end;
    }

    .sort-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .sort-btn:hover {
      border-color: #38bdf8;
      background: #1e3a5f;
    }

    .sort-btn .arrow {
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .sort-btn .arrow.desc {
      transform: rotate(180deg);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: #64748b;
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

    .error-msg {
      text-align: center;
      padding: 2rem 1rem;
      color: #f87171;
      display: none;
    }

    .error-msg.active { display: block; }

    /* Responsive */
    @media (max-width: 600px) {
      .header h1 { font-size: 1.5rem; }
      .search-box { flex-direction: column; }
      .search-box button { width: 100%; }
      .result-link { flex-wrap: wrap; }
      .result-img, .result-img-placeholder { width: 48px; height: 48px; }
      .result-preco { min-width: auto; font-size: 1.1rem; }
      .stats { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>BuscaPreco</h1>
    <p>Compare precos entre Google Shopping e Amazon</p>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="input-produto" placeholder="Ex: iPhone 15, Air Fryer, Notebook..." autocomplete="off">
      <button id="btn-buscar" onclick="buscar()">Buscar</button>
    </div>
  </div>

  <div class="avisos" id="avisos"></div>
  <div class="stats" id="stats" style="display: none;"></div>

  <div class="sort-bar" id="sort-bar">
    <button class="sort-btn" id="btn-sort" onclick="toggleSort()">
      <span>Preco</span>
      <span class="arrow" id="sort-arrow">&#9650;</span>
      <span id="sort-label">Menor primeiro</span>
    </button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Buscando os melhores precos...</p>
    <p style="font-size: 0.8rem; margin-top: 0.5rem; color: #64748b;">Isso pode levar alguns segundos</p>
  </div>

  <div class="error-msg" id="error"></div>

  <div class="results" id="results">
    <div class="empty-state" id="empty">
      <div class="icon">&#128269;</div>
      <p>Pesquise um produto para comparar precos</p>
    </div>
  </div>

  <script>
    const input = document.getElementById('input-produto');
    const btn = document.getElementById('btn-buscar');
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    const stats = document.getElementById('stats');
    const error = document.getElementById('error');
    const avisosEl = document.getElementById('avisos');
    const sortBar = document.getElementById('sort-bar');
    const sortArrow = document.getElementById('sort-arrow');
    const sortLabel = document.getElementById('sort-label');

    let currentItems = [];
    let sortAsc = true; // true = crescente, false = decrescente

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') buscar();
    });

    // Focus input on load
    input.focus();

    function toggleSort() {
      sortAsc = !sortAsc;
      sortArrow.classList.toggle('desc', !sortAsc);
      sortArrow.innerHTML = sortAsc ? '&#9650;' : '&#9660;';
      sortLabel.textContent = sortAsc ? 'Menor primeiro' : 'Maior primeiro';

      const sorted = [...currentItems].sort((a, b) =>
        sortAsc ? a.preco - b.preco : b.preco - a.preco
      );
      renderResults(sorted);
    }

    async function buscar() {
      const produto = input.value.trim();
      if (!produto) {
        input.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Buscando...';
      loading.classList.add('active');
      error.classList.remove('active');
      results.innerHTML = '';
      stats.style.display = 'none';
      sortBar.style.display = 'none';
      avisosEl.innerHTML = '';
      currentItems = [];
      sortAsc = true;
      sortArrow.classList.remove('desc');
      sortArrow.innerHTML = '&#9650;';
      sortLabel.textContent = 'Menor primeiro';

      try {
        const res = await fetch(`/api/buscar?q=${encodeURIComponent(produto)}`);
        const data = await res.json();

        if (data.erro) {
          throw new Error(data.erro);
        }

        // Mostra avisos se houver
        if (data.avisos && data.avisos.length > 0) {
          avisosEl.innerHTML = data.avisos
            .map(a => `<div class="aviso">${escapeHtml(a)}</div>`)
            .join('');
        }

        currentItems = data.resultados;
        renderStats(data);
        renderResults(data.resultados);

        if (data.resultados.length > 0) {
          sortBar.style.display = 'flex';
        }
      } catch (err) {
        error.textContent = `Erro ao buscar: ${err.message}`;
        error.classList.add('active');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Buscar';
        loading.classList.remove('active');
      }
    }

    function renderStats(data) {
      if (data.total === 0) {
        stats.style.display = 'none';
        return;
      }

      const menor = data.resultados[0];
      const maior = data.resultados[data.resultados.length - 1];

      stats.innerHTML = `
        <div class="stat-card">
          <div class="label">Total</div>
          <div class="value">${data.total}</div>
        </div>
        <div class="stat-card">
          <div class="label">Google Shopping</div>
          <div class="value">${data.google_shopping}</div>
        </div>
        <div class="stat-card">
          <div class="label">Amazon</div>
          <div class="value">${data.amazon}</div>
        </div>
        <div class="stat-card menor">
          <div class="label">Menor preco</div>
          <div class="value">${escapeHtml(menor.preco_texto)}</div>
        </div>
        <div class="stat-card maior">
          <div class="label">Maior preco</div>
          <div class="value">${escapeHtml(maior.preco_texto)}</div>
        </div>
      `;
      stats.style.display = 'flex';
    }

    function renderResults(items) {
      if (items.length === 0) {
        results.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128533;</div>
            <p>Nenhum resultado encontrado.</p>
            <p style="margin-top: 0.5rem; font-size: 0.85rem; color: #94a3b8;">
              Verifique os avisos acima ou tente outro termo de busca.
            </p>
          </div>
        `;
        return;
      }

      results.innerHTML = items.map((item, i) => {
        const isMelhor = i === 0;
        const badgeClass = item.fonte === 'Amazon' ? 'badge-amazon' : 'badge-google';

        const imgHtml = item.imagem
          ? `<img class="result-img" src="${escapeHtml(item.imagem)}" alt="" loading="lazy">`
          : `<div class="result-img-placeholder">&#128722;</div>`;

        const wrapper = item.link
          ? [`<a class="result-link" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">`, '</a>']
          : ['<div class="result-link">', '</div>'];

        return `
          <div class="result-card${isMelhor ? ' melhor' : ''}">
            ${wrapper[0]}
              <div class="result-rank">${i + 1}</div>
              ${imgHtml}
              <div class="result-info">
                <div class="result-nome">
                  ${escapeHtml(item.nome)}
                </div>
                <div class="result-meta">
                  <span class="badge ${badgeClass}">${escapeHtml(item.fonte)}</span>
                  <span>${escapeHtml(item.loja || '')}</span>
                  ${item.avaliacao ? `<span>${escapeHtml(item.avaliacao)}</span>` : ''}
                  ${isMelhor ? '<span class="tag-melhor">Melhor preco</span>' : ''}
                </div>
              </div>
              <div class="result-preco">${escapeHtml(item.preco_texto)}</div>
            ${wrapper[1]}
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      const el = document.createElement('span');
      el.textContent = text;
      return el.innerHTML;
    }
  </script>

</body>
</html>
